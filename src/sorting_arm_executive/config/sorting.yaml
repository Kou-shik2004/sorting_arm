/**:
  ros__parameters:
    use_sim_time: true

    cycle_object_count: 4

    readiness_timeout_s: 120.0
    detect_timeout_s: 2.0
    sync_timeout_s: 10.0
    cancel_timeout_s: 5.0

    destination_slots:
      labels: ["red", "red", "blue", "blue"]
      centre_x: [0.58, 0.58, 0.58, 0.58]
      centre_y: [0.38, 0.32, -0.32, -0.38]
      centre_z: [0.525, 0.525, 0.525, 0.525]

    # Used only when app.launch.xml selects the fixed provider. Camera mode is
    # the normal application path and never reads these object coordinates.
    fixed_objects:
      ids: ["red_box_1", "blue_box_1", "blue_box_2", "red_box_2"]
      labels: ["red", "blue", "blue", "red"]
      centre_x: [0.40, 0.40, 0.52, 0.52]
      centre_y: [0.12, -0.12, 0.12, -0.12]
      centre_z: [0.520, 0.520, 0.520, 0.520]
      size_x: [0.04, 0.04, 0.04, 0.04]
      size_y: [0.04, 0.04, 0.04, 0.04]
      size_z: [0.04, 0.04, 0.04, 0.04]
