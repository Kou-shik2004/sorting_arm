/**:
  ros__parameters:
    use_sim_time: true

    cube_dimensions: [0.04, 0.04, 0.04]

    source_area:
      minimum: [-0.18, -0.48, 0.50]
      maximum: [0.88, 0.48, 0.55]

    # Tray footprints from sorting_cell.sdf and SceneManager, expanded by the cube half-width.
    # Placed cubes remain collision objects but are not future pickup candidates.
    excluded_areas:
      minimum_x: [0.56, 0.56]
      minimum_y: [0.22, -0.50]
      maximum_x: [0.84, 0.84]
      maximum_y: [0.50, -0.22]

    colour:
      red_low_hue: [0, 10]
      red_high_hue: [170, 179]
      blue_hue: [100, 130]
      minimum_saturation: 80
      minimum_value: 80

    detector:
      # the two areas below are tuned for exactly this stream size, nothing rescales them yet.
      tuned_image_width: 1280
      tuned_image_height: 960
      minimum_contour_area: 400.0
      minimum_top_face_area: 480
      minimum_valid_depth_fraction: 0.70
      top_depth_percentile: 0.20
      top_depth_tolerance: 0.015
      physical_size_tolerance: 0.015

    synchronization:
      maximum_interval: 0.010

    # real-time watchdog on a new synchronized frame, not a sim-seconds budget -
    # widened so it survives Gazebo dipping below RTF 1
    capture_timeout: 3.0
    transform_timeout: 0.2

    registration:
      verified: true

    display:
      motion_threshold_radians: 0.001
      viewer_scale: 1.0
