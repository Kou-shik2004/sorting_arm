name: Continuous integration

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/*.md'
      - '.docker/runtime/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - '!src/**/*.md'
      - '.docker/runtime/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      clean_image:
        description: Build the CI image without using cached layers
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Tested headless image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and test the clean workspace
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/runtime/Dockerfile
          target: test
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GITHUB_RUN_ID=${{ github.run_id }}
          cache-from: type=gha,scope=sorting-arm-ci
          cache-to: type=gha,mode=max,scope=sorting-arm-ci,ignore-error=true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_image }}
          outputs: type=cacheonly
          push: false

      - name: Verify the headless runtime dependencies
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/runtime/Dockerfile
          target: runtime-deps-check
          cache-from: type=gha,scope=sorting-arm-runtime
          cache-to: type=gha,mode=max,scope=sorting-arm-runtime,ignore-error=true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_image }}
          outputs: type=cacheonly
          push: false

      - name: Build and load the headless runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/runtime/Dockerfile
          target: runtime-headless
          load: true
          tags: sorting_arm_headless:${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GITHUB_RUN_ID=${{ github.run_id }}
          cache-from: |
            type=gha,scope=sorting-arm-ci
            type=gha,scope=sorting-arm-runtime
          cache-to: type=gha,mode=max,scope=sorting-arm-runtime,ignore-error=true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_image }}
          push: false

      - name: Validate the headless runtime
        run: |
          bash .docker/runtime/validate-image.sh \
            "sorting_arm_headless:${GITHUB_SHA}" \
            "${GITHUB_SHA}"

      - name: Build and load the smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/runtime/Dockerfile
          target: smoke
          load: true
          tags: sorting_arm_smoke:${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GITHUB_RUN_ID=${{ github.run_id }}
          cache-from: |
            type=gha,scope=sorting-arm-ci
            type=gha,scope=sorting-arm-runtime
          cache-to: type=gha,mode=max,scope=sorting-arm-runtime,ignore-error=true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_image }}
          push: false

      - name: Run the bounded headless smoke test
        run: |
          set +e
          timeout --signal=INT --kill-after=15s 300s \
            docker run --rm --init \
              --env ROS_DOMAIN_ID=42 \
              --shm-size=512m \
              "sorting_arm_smoke:${GITHUB_SHA}"
          smoke_status=$?
          set -e

          if [ "${smoke_status}" -eq 124 ]; then
            echo "Headless smoke test exceeded 300 seconds" >&2
          fi

          exit "${smoke_status}"
