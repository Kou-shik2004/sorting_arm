services:
  dev:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      args:
        USERNAME: rosdev
        USER_UID: 1000
        USER_GID: 1000
    image: sorting_arm:jazzy
    container_name: sorting_arm
    command: sleep infinity          # stays alive; exec or attach at will
    network_mode: host               # DDS discovery. Note: container ports are
    ipc: host                        # host ports. Qt/Gazebo shared memory.
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1           # Qt crashes on MIT-SHM across the IPC boundary
    volumes:
      - .:/sorting_arm_ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw            # GUI forwarding

    # No named volumes here on purpose - enter, build, source, launch is the
    # whole base offering. Want an NVIDIA GPU? scripts/start adds
    # .docker/compose.gpu.yaml automatically when it finds the runtime.
    # Want VS Code Server or bash history to survive a container rebuild?
    # scripts/start --dev adds .docker/compose.dev.yaml.
    #
    # Want your own persistent tool state (an editor's server, a shell
    # history, whatever)? Add it yourself, either as a bind mount:
    #   - ~/.some-tool:/home/rosdev/.some-tool:rw
    # or as a named volume, declared under `volumes:` at the bottom of this
    # file the same way compose.dev.yaml does it.
