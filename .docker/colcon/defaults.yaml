# colcon defaults. COLCON_HOME points here (see .docker/bashrc.sh) so these
# survive an image rebuild — the default ~/.colcon is wiped on container
# recreate.
build:
  cmake-args:
    # Pin the ROS python. uv's python3.12 sits earlier on PATH and CMake probes
    # the versioned name first, so without this it picks the uv interpreter,
    # which has no catkin_pkg, and ament_cmake fails to configure. The failure
    # only hits a package's FIRST configure, so it looks like one random package
    # broke.
    - -DPython3_EXECUTABLE=/usr/bin/python3
    # Emit compile_commands.json for clang-tidy.
    - -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
